<div 
    id="{{ id }}"
    {% if hx_swap_oob %} 
        hx-swap-oob="true"
    {% endif %}
>
    <input 
        id="{{ id }}--value" 
        {% if is_trigger %} 
            hx-post="/{{ name }}/{{ id }}/input" 
            hx-trigger="input" 
            hx-swap="none" 
            hx-include="{{ hx_include }}"
        {% endif %}
        type="text" 
        value="{{ value }}" 
        name="{{ id }}--value"
    >
</div>
