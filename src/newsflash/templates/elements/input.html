<div 
    id="{{ id }}"
    {% if hx_swap_oob %} 
        hx-swap-oob="true"
    {% endif %}
>
    <input 
        id="{{ id }}--value" 
        
        {% if has_input_trigger %} 
            hx-post="{{ input_endpoint_url }}" 
            hx-trigger="input" 
            hx-swap="none" 
            hx-include="{{ input_hx_include }}"
            hx-indicator="#spinner"
        {% endif %}
        
        type="{{ input_type }}" 
        value="{{ value }}" 
        name="{{ id }}--value"
        placeholder="{{ placeholder }}"
        autocomplete="off"
    >
</div>
