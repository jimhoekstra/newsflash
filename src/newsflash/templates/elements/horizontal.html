<div 
    id="{{ id }}" 
    class="horizontal{% if wide %} wide{% endif %}"
    {% if hx_swap_oob %} 
        hx-swap-oob="true"
    {% endif %}
>
    {% for element in elements.values() %}
        <div class="{% if justify %}horizontal-item{% endif %}">
            {{ element | safe }}
        </div>
    {% endfor %}
</div>
