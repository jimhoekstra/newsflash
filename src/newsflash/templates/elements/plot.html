<div 
    id="{{ id }}" 
    class="newsflash-plot" 
    style="height: {{ height }}px;"
    {% if is_trigger and not hx_swap_oob %} 
        hx-post="/{{ name }}/{{ id }}/revealed" 
        hx-trigger="revealed" 
        hx-swap="none" 
        hx-include="{{ hx_include }}"
    {% endif %}
    {% if hx_swap_oob %} hx-swap-oob="true" {% endif %}
>
    {{ rendered_plot | safe }}    
</div>
