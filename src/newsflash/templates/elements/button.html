<button 
    id="{{ id }}"
    {% if has_click_trigger %} 
        hx-post="{{ click_endpoint_url }}" 
        hx-trigger="click" 
        hx-swap="none" 
        hx-include="{{ click_hx_include }}"
        hx-indicator="#spinner"
    {% endif %}
    {% if hx_swap_oob %} 
        hx-swap-oob="true"
    {% endif %}
>
    {{ label }}
</button>
