<rect 
    class="{{ classes|join(' ') }}" 
    x="{{ top_left.x }}" 
    y="{{ top_left.y }}" 
    width="{{ width }}" 
    height="{{ height }}" 
    rx="{{ rx_ry }}" 
    ry="{{ rx_ry }}" 
    style="{{ styles|join(' ') }}"{% for attr, value in attributes.items() %}
    {{ attr }}="{{ value }}"{% endfor %}
/>